name: Approve pull requests securely
description: Approve pull requests securely
author: Shunsuke Suzuki
branding:
  icon: git-commit
  color: green
inputs:
  app_id:
    description: |
      GitHub App ID.
      Either client_id or app_id is required.
    required: false
  client_id:
    description: |
      GitHub App Client ID.
      Either client_id or app_id is required.
      client_id takes precedence when both are set.
    required: false
  app_private_key:
    description: |
      GitHub App Private Key.
      Either app_private_key or aws_kms_key_id is required.
    required: false
  aws_kms_key_id:
    description: |
      Key ID, key ARN, alias name, or alias ARN of an AWS KMS key holding the
      GitHub App private key.
      Set this instead of app_private_key when the private key is stored in AWS
      KMS and can never be exported.
    required: false
  aws_region:
    description: |
      The AWS region of the KMS key.
      It can be omitted when aws_kms_key_id is an ARN, which carries the region.
      Otherwise it falls back to the AWS SDK's own resolution, such as the
      AWS_REGION environment variable.
    required: false
  aws_role_to_assume:
    description: |
      ARN of the AWS IAM role to assume with the GitHub OIDC token.
      The job needs the permission `id-token: write`.
      The credentials are kept inside this action and are never exported, so
      later steps of the job can't see them.
      Leave this unset to use the standard AWS credential chain instead, which
      is what aws-actions/configure-aws-credentials sets up.
    required: false

  # For Client
  server_repository_name:
    description: |
      Server repository name.
      Required for client mode.
    required: false
  server_repository_owner:
    description: |
      Server repository owner.
    required: false
    default: ${{github.repository_owner}}
  repository_owner:
    description: |
      The repository owner of the pull request to approve.
    required: false
    default: ${{github.repository_owner}}
  repository_name:
    description: |
      The repository name of the pull request to approve.
    required: false
    default: ${{github.event.repository.name}}
  pull_request_number:
    description: |
      The pull request number to approve.
      Required for client mode.
    required: false

  # For both Client and Server
  github_token:
    description: |
      GitHub token.
      For client: used to read the pull request (`contents:read` and `pull_requests:read` permissions required).
      For server: used to approve the pull request (`pull_requests:write` permission required).
    required: false
    default: ${{github.token}}
  allowed_committers:
    description: |
      A list of allowed committers.
    required: false
    default: |
      renovate[bot]
      dependabot[bot]
runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
